name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventional-title:
    name: conventional-title
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with: {persist-credentials: false}
      - name: Validate squash subject
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            scripts/validate-conventional.sh "$PR_TITLE"
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            scripts/validate-conventional.sh "$(git log -1 --format=%s)"
          fi

  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          persist-credentials: false
      - name: Run containerized quality checks
        run: scripts/run-ci-container.sh quality

  validate:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset:
          - dev
          - release
          - tidy
          - asan
          - ubsan

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          persist-credentials: false

      - name: Run containerized preset
        run: scripts/run-ci-container.sh ${{ matrix.preset }}

  daemon:
    name: daemon
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test daemon
        run: |
          cmake -S daemon -B build/daemon -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/daemon
          ctest --test-dir build/daemon --output-on-failure
