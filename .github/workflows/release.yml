name: Release
on:
  workflow_dispatch:
    inputs:
      version: {description: Stable MAJOR.MINOR.PATCH version committed on main, required: true, type: string}
      sha: {description: Exact synchronized main commit to release, required: true, type: string}
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Validate exact main metadata
        env: {VERSION: "${{ inputs.version }}", REQUESTED_SHA: "${{ inputs.sha }}"}
        run: |
          test "$GITHUB_REF_NAME" = main
          test "$GITHUB_SHA" = "$REQUESTED_SHA"
          git fetch --no-tags origin main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          scripts/release.sh verify "$VERSION"
  dashboard:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with: {persist-credentials: false}
      - run: scripts/release.sh dashboard "${{ inputs.version }}" "$RUNNER_TEMP/assets"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: dashboard-assets, path: "${{ runner.temp }}/assets/*", if-no-files-found: error}
  daemon:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, runner: ubuntu-24.04, machine: "Advanced Micro Devices X86-64"}
          - {arch: aarch64, runner: ubuntu-24.04-arm, machine: AArch64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with: {persist-credentials: false}
      - name: Build and test static daemon natively
        env:
          ALPINE_IMAGE: alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
          ARCH: ${{ matrix.arch }}
          EXPECTED_MACHINE: ${{ matrix.machine }}
          VERSION: ${{ inputs.version }}
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" --volume "$RUNNER_TEMP:/runner-temp" \
            --workdir /workspace --env ARCH --env EXPECTED_MACHINE --env VERSION \
            "$ALPINE_IMAGE" sh -euxc '
              apk add --no-cache build-base cmake ninja file git tar
              cmake -S daemon -B build/daemon-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXE_LINKER_FLAGS=-static
              cmake --build build/daemon-release
              ctest --test-dir build/daemon-release --output-on-failure
              build/daemon-release/dashboard-daemon --version | grep -Fx "dashboard-daemon $VERSION"
              sed '\''s/host = ""/host = "127.0.0.1"/'\'' daemon/package/config.toml >/runner-temp/config.toml
              build/daemon-release/dashboard-daemon --config /runner-temp/config.toml --check-config
              file build/daemon-release/dashboard-daemon | grep -F "statically linked"
              readelf -h build/daemon-release/dashboard-daemon | grep -F "$EXPECTED_MACHINE"
              ! readelf -l build/daemon-release/dashboard-daemon | grep -F INTERP
              scripts/release.sh daemon "$VERSION" "$ARCH" build/daemon-release/dashboard-daemon /runner-temp/assets
              prefix="dashboard-daemon-$VERSION-linux-$ARCH"
              archive="/runner-temp/assets/$prefix.tar.gz"
              manifest=$(tar -tzf "$archive")
              test "$(printf "%s\n" "$manifest" | wc -l)" -eq 5
              for entry in "$prefix/" "$prefix/config.toml" "$prefix/dashboard-daemon" "$prefix/dashboard-daemon.service" "$prefix/install.sh"; do
                printf "%s\n" "$manifest" | grep -Fx "$entry"
              done
            '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: "daemon-${{ matrix.arch }}-assets", path: "${{ runner.temp }}/assets/*", if-no-files-found: error}
  publish:
    needs: [dashboard, daemon]
    runs-on: ubuntu-24.04
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {pattern: "*-assets", path: "${{ runner.temp }}/assets", merge-multiple: true}
      - name: Verify assets and publish release
        env: {GH_TOKEN: "${{ github.token }}", VERSION: "${{ inputs.version }}"}
        run: |
          tag="v$VERSION"
          test "$(find "$RUNNER_TEMP/assets" -type f | wc -l)" -eq 6
          (cd "$RUNNER_TEMP/assets" && sha256sum --check *.sha256)
          for archive in rpi-dashboard-$VERSION.tar.gz dashboard-daemon-$VERSION-linux-x86_64.tar.gz dashboard-daemon-$VERSION-linux-aarch64.tar.gz; do test -f "$RUNNER_TEMP/assets/$archive"; done
          for arch in x86_64 aarch64; do
            prefix="dashboard-daemon-$VERSION-linux-$arch"
            manifest=$(tar -tzf "$RUNNER_TEMP/assets/$prefix.tar.gz")
            test "$(printf '%s\n' "$manifest" | wc -l)" -eq 5
            for entry in "$prefix/" "$prefix/config.toml" "$prefix/dashboard-daemon" "$prefix/dashboard-daemon.service" "$prefix/install.sh"; do
              printf '%s\n' "$manifest" | grep -Fx "$entry"
            done
          done
          awk -v h="## [$VERSION]" 'index($0,h)==1{f=1;next} f&&/^## \[/{exit} f{print}' CHANGELOG.md >release-notes.md
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$tag\") | [.id, .draft, .target_commitish] | @tsv" | head -n1)
          if [ -n "$release" ]; then
            test "$(printf '%s\n' "$release" | cut -f2)" = true
            test "$(printf '%s\n' "$release" | cut -f3)" = "$GITHUB_SHA"
            gh release upload "$tag" "$RUNNER_TEMP"/assets/* --clobber
          else
            test -z "$(git ls-remote --tags origin "refs/tags/$tag")"
            gh release create "$tag" "$RUNNER_TEMP"/assets/* --draft --target "$GITHUB_SHA" --notes-file release-notes.md --title "rpi-dashboard $VERSION"
          fi
          gh release edit "$tag" --notes-file release-notes.md --title "rpi-dashboard $VERSION" --draft=false
