name: Deploy production

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing stable MAJOR.MINOR.PATCH release version
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: raspberry-pi-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: raspberry-pi-production
      url: https://github.com/${{ github.repository }}/releases/tag/v${{ inputs.version }}
    steps:
      - name: Validate requested release
        env:
          VERSION: ${{ inputs.version }}
        run: printf '%s\n' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

      - name: Download and verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          api="https://api.github.com/repos/$REPOSITORY/releases/tags/v$VERSION"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" "$api" >"$RUNNER_TEMP/release.json"
          test "$(jq -r .draft "$RUNNER_TEMP/release.json")" = false
          test "$(jq -r .prerelease "$RUNNER_TEMP/release.json")" = false
          test "$(jq -r .tag_name "$RUNNER_TEMP/release.json")" = "v$VERSION"
          for asset in "rpi-dashboard-$VERSION.tar.gz" "rpi-dashboard-$VERSION.tar.gz.sha256"; do
            url=$(jq -er --arg name "$asset" '.assets[] | select(.name == $name) | .url' "$RUNNER_TEMP/release.json")
            curl --fail --silent --show-error --location \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/octet-stream" "$url" --output "$RUNNER_TEMP/$asset"
          done
          (cd "$RUNNER_TEMP" && sha256sum --check "rpi-dashboard-$VERSION.tar.gz.sha256")
          tar --extract --gzip --to-stdout --file "$RUNNER_TEMP/rpi-dashboard-$VERSION.tar.gz" \
            "rpi-dashboard-$VERSION/scripts/deploy-on-pi.sh" >"$RUNNER_TEMP/deploy-on-pi.sh"
          chmod 0755 "$RUNNER_TEMP/deploy-on-pi.sh"

      - name: Connect to the production tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ vars.PI_HOST }}

      - name: Configure dedicated SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PI_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.PI_SSH_HOST_KEY }}
        run: |
          install -d -m 0700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" >"$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$SSH_HOST_KEY" >"$RUNNER_TEMP/ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/ssh/key" "$RUNNER_TEMP/ssh/known_hosts"

      - name: Transfer and deploy exact release
        env:
          HOST: ${{ vars.PI_HOST }}
          USER: ${{ vars.PI_SSH_USER }}
          VERSION: ${{ inputs.version }}
        run: |
          ssh_options="-i $RUNNER_TEMP/ssh/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts"
          ssh $ssh_options "$USER@$HOST" 'install -d -m 0700 ~/rpi-dashboard-deploy'
          scp $ssh_options "$RUNNER_TEMP/rpi-dashboard-$VERSION.tar.gz" \
            "$RUNNER_TEMP/rpi-dashboard-$VERSION.tar.gz.sha256" "$RUNNER_TEMP/deploy-on-pi.sh" \
            "$USER@$HOST:rpi-dashboard-deploy/"
          ssh $ssh_options "$USER@$HOST" \
            "~/rpi-dashboard-deploy/deploy-on-pi.sh ~/rpi-dashboard-deploy/rpi-dashboard-$VERSION.tar.gz ~/rpi-dashboard-deploy/rpi-dashboard-$VERSION.tar.gz.sha256"
