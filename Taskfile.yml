version: '3'

tasks:
  configure:
    desc: Configure the development build
    cmds:
      - cmake --preset dev

  build:
    desc: Build the development configuration
    deps: [configure]
    cmds:
      - cmake --build --preset dev

  test:
    desc: Build and run all tests
    deps: [build]
    cmds:
      - ctest --preset dev

  check:
    desc: Build with clang-tidy and run tests
    cmds:
      - cmake --preset tidy
      - cmake --build --preset tidy
      - ctest --preset tidy

  run:
    desc: Run the dashboard locally
    deps: [build]
    cmds:
      - ./build/dev/src/dashboard/rpi-dashboard

  run-windowed:
    desc: Run at the target logical geometry in a development window
    deps: [build]
    cmds:
      - ./build/dev/src/dashboard/rpi-dashboard --windowed --width 1480 --height 320

  install:
    desc: Build and install the Raspberry Pi kiosk
    cmds:
      - cmake --preset release
      - cmake --build --preset release
      - sudo cmake --install build/release
      - sudo /usr/local/libexec/rpi-dashboard/provision.sh

  test-asan:
    desc: Build and run tests with AddressSanitizer
    cmds:
      - cmake --preset asan
      - cmake --build --preset asan
      - ctest --preset asan

  test-ubsan:
    desc: Build and run tests with UndefinedBehaviorSanitizer
    cmds:
      - cmake --preset ubsan
      - cmake --build --preset ubsan
      - ctest --preset ubsan

  test-pi:
    desc: Synchronize to a dedicated Raspberry Pi directory and run native tests
    requires:
      vars: [PI_HOST, PI_PATH]
    cmds:
      - rsync -az --exclude .git --exclude build ./ '{{.PI_HOST}}:{{.PI_PATH}}/'
      - ssh '{{.PI_HOST}}' 'cd {{.PI_PATH}} && task test'

  format:
    desc: Format C++ sources
    cmds:
      - find src tests -type f \( -name '*.cpp' -o -name '*.h' \) -print0 | xargs -0 clang-format -i

  clean:
    desc: Remove local build outputs
    cmds:
      - cmake -E remove_directory build
