version: '3'

vars:
  QMLFORMAT:
    sh: |
      if command -v qmake6 >/dev/null 2>&1; then
        qt_qmlformat="$(qmake6 -query QT_INSTALL_BINS)/qmlformat"
        if test -x "$qt_qmlformat"; then
          echo "$qt_qmlformat"
          exit 0
        fi
      fi
      command -v qmlformat

tasks:
  configure:
    desc: Configure the development build
    cmds:
      - cmake --preset dev

  build:
    desc: Build the development configuration
    deps: [configure]
    cmds:
      - cmake --build --preset dev

  test:
    desc: Build and run dashboard tests
    deps: [build]
    cmds:
      - ctest --preset dev

  check:
    desc: Check formatting, build with clang-tidy, and run tests
    cmds:
      - task: format:check
      - cmake --preset tidy
      - cmake --build --preset tidy
      - ctest --preset tidy

  ci:
    desc: Run the authoritative containerized CI preflight
    cmds:
      - scripts/run-ci-container.sh dev
      - scripts/run-ci-container.sh release
      - scripts/run-ci-container.sh tidy
      - scripts/run-ci-container.sh asan
      - scripts/run-ci-container.sh ubsan
      - task daemon-test

  run:
    desc: Run the dashboard locally
    deps: [build]
    cmds:
      - ./build/dev/src/dashboard/rpi-dashboard

  run-windowed:
    desc: Run at the target logical geometry in a development window
    deps: [build]
    vars:
      WIDTH: '{{default "1480" .WIDTH}}'
      HEIGHT: '{{default "320" .HEIGHT}}'
      TELEMETRY_BIND_ADDRESS: '{{default "127.0.0.1" .TELEMETRY_BIND_ADDRESS}}'
      TELEMETRY_PORT: '{{default "51337" .TELEMETRY_PORT}}'
    cmds:
      - >-
        ./build/dev/src/dashboard/rpi-dashboard
        --windowed
        --width {{.WIDTH}}
        --height {{.HEIGHT}}
        --telemetry-bind-address {{.TELEMETRY_BIND_ADDRESS}}
        --telemetry-port {{.TELEMETRY_PORT}}

  daemon-build:
    desc: Build the standalone telemetry daemon without Qt
    cmds:
      - cmake -S daemon -B build/daemon -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - cmake --build build/daemon

  daemon-test:
    desc: Build and test the standalone telemetry daemon
    deps: [daemon-build]
    cmds:
      - ctest --test-dir build/daemon --output-on-failure

  install:daemon:
    desc: Build and install the standalone telemetry daemon
    cmds:
      - cmake -S daemon -B build/daemon -G Ninja -DCMAKE_BUILD_TYPE=Release
      - cmake --build build/daemon
      - cmake -E make_directory build/daemon/package
      - cmake -E copy build/daemon/dashboard-daemon build/daemon/package/dashboard-daemon
      - cmake -E copy daemon/package/dashboard-daemon.service build/daemon/package/dashboard-daemon.service
      - cmake -E copy daemon/package/config.toml build/daemon/package/config.toml
      - cmake -E copy daemon/package/install.sh build/daemon/package/install.sh
      - sudo build/daemon/package/install.sh

  install:
    desc: Build and install the Raspberry Pi kiosk
    cmds:
      - ./install.sh

  test-asan:
    desc: Build and run tests with AddressSanitizer
    cmds:
      - cmake --preset asan
      - cmake --build --preset asan
      - ctest --preset asan

  test-ubsan:
    desc: Build and run tests with UndefinedBehaviorSanitizer
    cmds:
      - cmake --preset ubsan
      - cmake --build --preset ubsan
      - ctest --preset ubsan

  test-pi:
    desc: Synchronize to a dedicated Raspberry Pi directory and run native tests
    requires:
      vars: [PI_HOST, PI_PATH]
    cmds:
      - rsync -az --exclude .git --exclude build ./ '{{.PI_HOST}}:{{.PI_PATH}}/'
      - ssh '{{.PI_HOST}}' 'cd {{.PI_PATH}} && task test'

  format:
    desc: Format C++ and QML sources
    cmds:
      - find src tests -type f \( -name '*.cpp' -o -name '*.h' \) -print0 | xargs -0 clang-format -i
      - find src tests -type f -name '*.qml' -print0 | xargs -0 '{{.QMLFORMAT}}' -i --sort-imports

  format:check:
    desc: Check C++ and QML source formatting
    cmds:
      - find src tests -type f \( -name '*.cpp' -o -name '*.h' \) -print0 | xargs -0 clang-format --dry-run --Werror
      - |
        temporary_directory="$(mktemp -d)"
        trap 'rm -rf "$temporary_directory"' EXIT
        find src tests -type f -name '*.qml' -exec sh -c '
          temporary_directory="$1"
          shift
          for source_file do
            formatted_file="$temporary_directory/formatted.qml"
            if ! '{{.QMLFORMAT}}' --sort-imports "$source_file" > "$formatted_file"; then
              echo "qmlformat failed for $source_file" >&2
              touch "$temporary_directory/failed"
              continue
            fi
            if ! diff -u "$source_file" "$formatted_file"; then
              touch "$temporary_directory/failed"
            fi
          done
        ' sh "$temporary_directory" {} +
        test ! -e "$temporary_directory/failed"

  clean:
    desc: Remove local build outputs
    cmds:
      - cmake -E remove_directory build

  release:prepare:
    desc: Prepare VERSION and generated CHANGELOG.md on a release branch
    requires: {vars: [VERSION]}
    cmds:
      - scripts/release-prepare.sh prepare '{{.VERSION}}'

  release:check:
    desc: Verify committed release metadata and focused release tests
    requires: {vars: [VERSION]}
    cmds:
      - scripts/release-prepare.sh check '{{.VERSION}}'
      - cmake --preset dev
      - cmake --build --preset dev
      - ctest --preset dev -R '^(executable_version|release_)' --output-on-failure

  release:publish:
    desc: Dispatch and watch a guarded release from synchronized main
    requires: {vars: [VERSION]}
    cmds:
      - scripts/release-publish.sh '{{.VERSION}}'
